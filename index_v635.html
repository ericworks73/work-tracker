  <title>GSD</title>
  <script>
    // Cache buster: check the live file for a newer version and force one reload if stale.
    (function () {
      const CURRENT_VERSION = "v6.35";
      const RELOAD_FLAG = "gsd_reloaded_for_" + CURRENT_VERSION;
      fetch(window.location.href, { cache: "no-store" })
        .then(r => r.text())
        .then(html => {
          const match = html.match(/<!--\s*(v[\d.]+)\s*-->/);
          if (match && match[1] !== CURRENT_VERSION && !sessionStorage.getItem(RELOAD_FLAG)) {
            sessionStorage.setItem(RELOAD_FLAG, "1");
            window.location.reload(true);
          }
        })
        .catch(() => {}); // fail silently, never block the app from loading
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg0:        #05080f;
      --bg1:        #080d18;
      --bg2:        #0a1428;
      --glass:      rgba(255,255,255,0.03);
      --glass-bd:   #1a3a8a;
      --glass-hover:rgba(26,58,138,0.15);
      --ink:        #e8eeff;
      --ink-2:      #7a90b8;
      --ink-3:      #3a5a9a;
      --neon-purple:#cc2200;
      --neon-blue:  #4488ff;
      --neon-green: #39ff9a;
      --neon-amber: #ffd166;
      --neon-red:   #ff6655;
      --neon-pink:  #ff6688;
      --accent-red: #cc2200;
      --accent-blue:#1a3a8a;
      --r:          12px;
      --r-sm:       8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: var(--bg0); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; color: var(--ink); font-size: 15px; }

    /* Lock */
    #panel-0 { position: fixed; inset: 0; background: var(--bg0); display: flex; align-items: center; justify-content: center; z-index: 999; }
    #panel-1 { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: 20px; padding: 36px 32px; width: 300px; text-align: center; box-shadow: 0 0 60px rgba(204,34,0,0.2); }
    #panel-1 h2 { font-size: 18px; font-weight: 700; color: var(--neon-purple); margin-bottom: 6px; letter-spacing: -.3px; }
    #panel-1 p  { font-size: 12px; color: var(--ink-3); margin-bottom: 22px; }
    #field-2 { width: 100%; background: var(--glass); border: 1px solid var(--glass-bd); border-radius: var(--r-sm); padding: 10px 13px; font-size: 14px; outline: none; color: var(--ink); margin-bottom: 12px; font-family: inherit; transition: border-color .2s; }
    #field-2:focus { border-color: var(--accent-red); }
    #btn-3 { width: 100%; background: var(--accent-red); color: #fff; border: none; border-radius: var(--r-sm); padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity .2s; }
    #btn-3:hover { opacity: .85; }

    /* Header */
    #header { background: var(--bg1); padding: 12px 20px; display: flex; align-items: flex-start; gap: 16px; flex-shrink: 0; }
    #header-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
    #datetime-block { display: flex; align-items: center; gap: 8px; }
    #dt-time { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.2px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #dt-sub { font-size: 11px; font-weight: 700; color: var(--ink-2); letter-spacing: -.1px; line-height: 1.2; white-space: nowrap; }
    #stats-row { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
    .stat-cell { display: flex; align-items: center; gap: 8px; }
    .stat-val { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .stat-label { font-size: 9px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; }
    #weather-temp { color: var(--neon-amber); }
    #holiday-days { color: var(--neon-red); font-size: 13px; }
    #header-actions { display: flex; flex-direction: column; gap: 8px; width: 150px; flex-shrink: 0; }
    #add-btn { background: var(--accent-red); color: #fff; border: none; border-radius: var(--r-sm); padding: 10px 0; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; transition: opacity .2s; text-align: center; width: 100%; }
    #add-btn:hover { opacity: .85; }

    /* Overdue bar */
    #overdue-bar { background: rgba(255,107,107,0.15); border-bottom: 1px solid rgba(255,107,107,0.3); color: var(--neon-red); padding: 7px 18px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; align-items: center; justify-content: space-between; flex-shrink: 0; }

    /* Search + tabs */
    #filter-bar { background: var(--bg1); border-bottom: 1px solid rgba(26,58,138,0.4); padding: 10px 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    #search-bar { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-bd); border-radius: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 0; width: 100%; }
    #search-input { flex: 1; border: none; background: transparent; outline: none; font-size: 12px; font-family: inherit; color: var(--ink); text-align: center; min-width: 0; }
    #search-input::placeholder { color: var(--ink-3); }
    #search-clear { border: none; background: none; color: var(--ink-3); font-size: 14px; cursor: pointer; display: none; padding: 0; }
    #status-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #type-tabs { padding: 0; display: flex; align-items: center; }
    .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .chip-divider { width: 1px; height: 16px; background: rgba(26,58,138,0.4); margin: 0 4px; flex-shrink: 0; }
    .date-chip { border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
    #status-drop-btn { display: flex; align-items: center; gap: 6px; border: 1px solid var(--glass-bd); background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; font-family: inherit; white-space: nowrap; }
    #status-drop-btn.active { background: rgba(204,34,0,0.18); border-color: var(--accent-red); color: #fff; }
    #status-drop-btn .caret { font-size: 9px; color: var(--ink-2); }
    #status-drop-wrap { position: relative; }
    #status-drop-menu { position: absolute; top: calc(100% + 4px); left: 0; width: 200px; background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 50; }
    .status-drop-item { padding: 9px 14px; font-size: 12px; color: var(--ink); display: flex; justify-content: space-between; cursor: pointer; }
    .status-drop-item:hover { background: rgba(255,255,255,0.05); }
    .status-drop-item.active { background: rgba(204,34,0,0.15); border-left: 2px solid var(--accent-red); color: #fff; }
    .status-drop-item .count { color: var(--ink-2); }
    #type-drop-wrap { position: relative; }
    #type-drop-btn { display: flex; align-items: center; gap: 6px; border: 1px solid var(--glass-bd); background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; font-family: inherit; white-space: nowrap; }
    #type-drop-btn.active { color: #fff; background: rgba(255,255,255,0.06); }
    #type-drop-btn .caret { font-size: 9px; color: var(--ink-2); }
    #type-drop-menu { position: absolute; top: calc(100% + 4px); left: 0; width: 200px; background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 50; }
    .type-drop-item { padding: 9px 14px; font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .type-drop-item:hover { background: rgba(255,255,255,0.05); }
    .type-drop-item.active { background: rgba(255,255,255,0.06); color: #fff; }
    .type-drop-item .count { margin-left: auto; color: var(--ink-2); }

    /* Main */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* List pane */
    #list-pane { width: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 35px; background: var(--bg0); transition: width .2s; }
    #list-pane.narrow { width: 42%; min-width: 160px; }

    /* Cards */
    .card { background: var(--bg2); border: none; border-radius: var(--r); cursor: pointer; transition: background .15s, transform .15s; }
    .card:hover { background: rgba(26,58,138,0.12); transform: translateY(-1px); }
    .card.selected { border-left: 3px solid var(--accent-red); background: rgba(204,34,0,0.08); }
    .card.done { opacity: .35; }
    .card.starred { box-shadow: inset 3px 0 0 var(--accent-red); }
    .card-body { padding: 13px 15px 10px; }
    .card-row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .card-name { font-weight: 700; font-size: 18px; color: var(--ink); letter-spacing: -.2px; }
    .card-row2 { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .card-meta { font-size: 12px; color: var(--ink-3); }
    .card-context { display: none; }
    .card-next { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-next-label { color: var(--neon-green); font-weight: 600; }
    .card-footer { display: flex; align-items: center; gap: 8px; }
    .quick-btn { border: 1px solid rgba(26,58,138,0.4); background: rgba(26,58,138,0.1); color: var(--ink-2); border-radius: var(--r-sm); padding: 5px 13px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all .15s; }
    .quick-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
    .card-band { background: rgba(26,58,138,0.15); padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
    .card-band-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #4488ff; flex-shrink: 0; }
    .card-band-text  { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .card-footer-row { padding: 8px 14px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sep { color: var(--glass-bd); font-size: 12px; }
    .touch-dot { display: none; }
    .touch-label    { font-size: 13px; color: var(--ink-3); }
    .touch-label.stale { font-size: 13px; color: var(--neon-red); }

    /* Badges */
    .pri-badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .pri-High   { background: rgba(255,107,107,0.2); color: var(--neon-red); }
    .pri-Medium { background: rgba(255,209,102,0.2); color: var(--neon-amber); }
    .pri-Low    { background: rgba(255,255,255,0.08); color: var(--ink-3); }

    .status-badge { padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .s-act  { background: #4a1500; color: #ff8866; } .s-act .status-dot  { background: #ff8866; }
    .s-wait { background: #1a2a6a; color: #7aadff; } .s-wait .status-dot { background: #7aadff; }
    .s-stuck{ background: #5a0a00; color: #ff6655; } .s-stuck .status-dot{ background: #ff6655; }
    .s-done { background: rgba(255,255,255,0.05); color: var(--ink-3); } .s-done .status-dot { background: var(--ink-3); }

    .follow-chip { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 3px 9px; }
    .follow-overdue  { background: #5a0a00; color: #ff6655; font-weight: 700; }
    .follow-tomorrow { background: #2a2000; color: #ccaa44; }
    .follow-today    { background: #3a2800; color: #ffd166; font-weight: 700; }
    .follow-future   { background: #0a2a18; color: #44cc88; }
    .follow-date     { font-size: 11px; color: var(--ink-3); }

    /* Detail pane */
    #detail-pane { flex: 1; background: var(--bg1); border-left: 1px solid rgba(26,58,138,0.4); overflow-y: auto; padding: 20px 18px; display: none; }
    #detail-pane.open { display: block; }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 3px; }
    .detail-name { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.4px; }
    .detail-meta { font-size: 13px; color: var(--ink-3); margin-bottom: 5px; }
    .detail-coworkers { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
    .detail-chips { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .follow-label { font-size: 11px; color: var(--ink-3); }

    /* Field blocks with colored glass sections */
    .field-block { margin-bottom: 14px; border-radius: var(--r); overflow: hidden; }
    .field-label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
    .field-content { font-size: 15px; color: var(--ink); line-height: 1.65; }
    .field-content ul, .field-content ol { padding-left: 18px; margin: 2px 0; }
    .field-content li { margin: 2px 0; }
    .field-content b, .field-content strong { font-weight: 700; color: var(--ink); }
    .field-content i, .field-content em { font-style: italic; }
    .field-content p { margin: 0 0 3px; }

    .section-box { border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }
    .section-box .field-label { margin-bottom: 8px; }

    .box-next    { background: rgba(204,34,0,0.08);  border: none; }
    .box-next .field-label    { color: var(--accent-red); }

    .box-tasks   { background: rgba(26,58,138,0.15);  border: none; }
    .box-tasks .field-label   { color: var(--neon-blue); }

    .box-context { background: rgba(26,58,138,0.1); border: none; }
    .box-context .field-label { color: var(--neon-purple); }

    .box-last    { background: rgba(255,209,102,0.07); border: none; }
    .box-last .field-label    { color: var(--neon-amber); }

    .box-touch   { background: rgba(255,255,255,0.03); border: none; }
    .box-touch .field-label   { color: var(--ink-3); }

    .box-notes   { background: rgba(255,100,100,0.07); border: none; }
    .box-notes .field-label   { color: var(--neon-pink); }

    /* Buttons */
    .detail-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn { border: none; border-radius: var(--r-sm); padding: 11px 18px; font-size: 14px; cursor: pointer; font-family: inherit; flex: 1; min-width: 80px; font-weight: 600; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-back   { background: var(--glass); color: var(--ink-2); border: 1px solid var(--glass-bd); }
    .btn-edit   { background: var(--accent-red); color: #fff; }
    .btn-close  { background: rgba(57,255,154,0.15); color: var(--neon-green); border: 1px solid rgba(57,255,154,0.3); }
    .btn-delete { background: rgba(255,107,107,0.15); color: var(--neon-red); flex: 0; padding: 10px 14px; border: 1px solid rgba(255,107,107,0.3); }

    .icon-dock-row { display: flex; justify-content: flex-end; }
    .icon-dock-row.top { margin-bottom: 14px; }
    .icon-dock-row.bottom { margin-top: 4px; }
    .icon-dock { display: flex; align-items: center; gap: 2px; background: var(--glass); border: 1px solid var(--glass-bd); border-radius: 20px; padding: 4px; }
    .icon-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s, opacity .15s; }
    .icon-btn:hover { background: var(--glass-hover); }
    .icon-btn:active { opacity: .7; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .ib-back   { color: var(--ink-2); }
    .ib-edit   { color: var(--accent-red); }
    .ib-close  { color: var(--neon-green); }
    .ib-delete { color: var(--neon-red); }

    /* Edit pane */
    #edit-pane { flex: 1; background: var(--bg1); border-left: 1px solid rgba(26,58,138,0.4); overflow-y: auto; padding: 20px 18px; display: none; }
    #edit-pane.open { display: block; }
    .form-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; color: var(--ink); }
    .form-field { margin-bottom: 12px; }
    .form-label { font-size: 10px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .6px; display: block; }
    .form-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(26,58,138,0.35); border-radius: var(--r-sm); padding: 9px 11px; font-size: 13px; outline: none; font-family: inherit; color: var(--ink); transition: border-color .2s; }
    input[type="date"] { color-scheme: dark; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7) sepia(1) saturate(5) hue-rotate(220deg) brightness(1.4); cursor: pointer; width: 18px; height: 18px; opacity: 0.9; }
    .form-input:focus { border-color: var(--accent-red); }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .form-row .form-field { flex: 1; margin-bottom: 0; }
    .form-btns { display: flex; gap: 8px; }

    .rte-wrap { border: 1px solid rgba(26,58,138,0.35); border-radius: var(--r-sm); overflow: hidden; transition: border-color .2s; }
    .rte-wrap:focus-within { border-color: var(--accent-red); }
    .rte-toolbar { display: flex; gap: 4px; padding: 5px 7px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--glass-bd); flex-wrap: wrap; }
    .rte-btn { border: none; background: transparent; padding: 3px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; color: var(--ink-2); font-family: inherit; line-height: 1.4; }
    .rte-btn:hover { background: var(--glass-hover); color: var(--ink); }
    .rte-sep { width: 1px; background: var(--glass-bd); margin: 2px; }
    .rte-body { padding: 9px 11px; font-size: 15px; min-height: 80px; outline: none; line-height: 1.6; background: var(--bg2); color: var(--ink); }
    .rte-body ul, .rte-body ol { padding-left: 18px; margin: 2px 0; }
    .rte-body li { margin: 1px 0; }

    /* Quick modal */
    #quick-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    #quick-modal.open { display: flex; }
    #quick-box { background: var(--bg2); border: 1px solid var(--glass-bd); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 22px 20px 34px; box-shadow: 0 -8px 40px rgba(204,34,0,0.15); }
    #quick-handle { width: 36px; height: 4px; background: var(--glass-bd); border-radius: 2px; margin: 0 auto 18px; }
    #quick-name    { font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 3px; }
    #quick-company { font-size: 12px; color: var(--ink-3); margin-bottom: 18px; }
    .quick-field   { margin-bottom: 13px; }
    .quick-label   { font-size: 10px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; display: block; }
    .quick-input   { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(26,58,138,0.35); border-radius: var(--r-sm); padding: 9px 11px; font-size: 13px; outline: none; font-family: inherit; color: var(--ink); transition: border-color .2s; }
    .quick-input[type="date"] { color-scheme: dark; }
    .quick-input:focus { border-color: var(--neon-purple); }
    #quick-row     { display: flex; gap: 8px; margin-bottom: 18px; }
    #quick-row .quick-field { flex: 1; margin-bottom: 0; }
    #quick-save    { flex: 1; background: var(--accent-red); color: #fff; border: none; border-radius: var(--r-sm); padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity .2s; }
    #quick-save:hover { opacity: .85; }
    #quick-cancel  { flex: 1; background: var(--glass); color: var(--ink-2); border: 1px solid var(--glass-bd); border-radius: var(--r-sm); padding: 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
    #quick-btns    { display: flex; gap: 8px; }

    /* Tasks */
    
    .loading-msg { padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }
    .task-section { margin-bottom: 0; }
    .task-list { list-style: none; padding: 0; margin: 0 0 8px; }
    .task-item { display: flex; align-items: flex-start; gap: 9px; padding: 6px 0; border-bottom: 1px solid rgba(26,58,138,0.3); }
    .task-item:last-child { border-bottom: none; }
    .task-check { width: 15px; height: 15px; margin-top: 2px; cursor: pointer; accent-color: var(--accent-red); flex-shrink: 0; }
    .task-text  { flex: 1; font-size: 14px; color: var(--ink); line-height: 1.4; }
    .task-text.done { text-decoration: line-through; color: var(--ink-3); }
    .task-dates { font-size: 10px; color: var(--ink-3); white-space: nowrap; margin-top: 1px; }
    .task-add-row { display: flex; gap: 6px; margin-top: 6px; }
    .task-add-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-bd); border-radius: var(--r-sm); padding: 7px 10px; font-size: 12px; outline: none; font-family: inherit; color: var(--ink); transition: border-color .2s; }
    .task-add-input:focus { border-color: var(--accent-red); }
    .task-add-btn { background: var(--accent-blue); color: #fff; border: none; border-radius: var(--r-sm); padding: 7px 13px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }

    /* Select options dark */
    option { background: #1a1a2e; color: #f0eeff; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-bd); border-radius: 2px; }
    @media (max-width: 700px) {
      #header { padding: 10px 14px; gap: 10px; }
      #header-left { gap: 10px; }
      #dt-time { font-size: 17px; }
      .stat-val { font-size: 13px; }
      #header-actions { width: 110px; }
      #add-btn { padding: 8px 0; font-size: 13px; }
    }
  </style>
</head>

<div id="status-change-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
  <div style="background:var(--bg2);border:1px solid rgba(26,58,138,0.4);border-radius:16px;padding:24px 22px;width:340px;box-shadow:0 -8px 40px rgba(204,34,0,0.15);">

    <div id="scm-sub" style="font-size:12px;color:var(--ink-3);margin-bottom:16px;"></div>
    <label style="font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px;">Update Follow-Up Date</label>
    <input type="date" id="scm-next" class="form-input" style="margin-bottom:12px;color-scheme:dark;" />
    <div id="scm-cleardate-wrap" style="display:none;margin-bottom:14px;">

function weatherIconSvg(code, isDay) {
  const sun = `<circle cx="20" cy="16" r="9" fill="#ffcc55"/><g stroke="#ffcc55" stroke-width="2" stroke-linecap="round"><line x1="20" y1="1" x2="20" y2="5"/><line x1="20" y1="27" x2="20" y2="31"/><line x1="5" y1="16" x2="9" y2="16"/><line x1="31" y1="16" x2="35" y2="16"/><line x1="8" y1="4" x2="11" y2="7"/><line x1="29" y1="25" x2="32" y2="28"/><line x1="8" y1="28" x2="11" y2="25"/><line x1="29" y1="7" x2="32" y2="4"/></g>`;
  const moon = `<path d="M14 6a11 11 0 1 0 12 17A9 9 0 0 1 14 6z" fill="#c9d6ff"/>`;
  const cloudBig = `<ellipse cx="30" cy="28" rx="18" ry="11" fill="#e8eeff"/><ellipse cx="20" cy="24" rx="11" ry="9" fill="#e8eeff"/><ellipse cx="40" cy="24" rx="10" ry="8" fill="#e8eeff"/>`;
  const cloudGray = `<ellipse cx="28" cy="20" rx="18" ry="11" fill="#7a90b8"/><ellipse cx="18" cy="16" rx="11" ry="9" fill="#7a90b8"/><ellipse cx="38" cy="16" rx="10" ry="8" fill="#7a90b8"/>`;
  if (code === 0) {
    return isDay
      ? `<svg width="40" height="34" viewBox="0 0 40 34">${sun}</svg>`
      : `<svg width="40" height="34" viewBox="0 0 40 34">${moon}</svg>`;
  }
  if (code <= 3) {
    return isDay
      ? `<svg width="40" height="34" viewBox="0 0 56 40"><g transform="translate(-4,-2)">${sun}</g>${cloudBig}</svg>`
      : `<svg width="40" height="34" viewBox="0 0 56 40">${cloudGray}</svg>`;
  }
  if (code === 45 || code === 48) {
    return `<svg width="40" height="34" viewBox="0 0 56 40">${cloudGray}<g stroke="#c9d6ff" stroke-width="2" stroke-linecap="round" opacity="0.8"><line x1="8" y1="32" x2="48" y2="32"/><line x1="12" y1="37" x2="44" y2="37"/></g></svg>`;
  }
  if (code >= 51 && code <= 67 || code >= 80 && code <= 82) {
    return `<svg width="40" height="34" viewBox="0 0 56 44">${cloudGray}<g stroke="#4488ff" stroke-width="2.5" stroke-linecap="round"><line x1="16" y1="32" x2="12" y2="42"/><line x1="28" y1="32" x2="24" y2="42"/><line x1="40" y1="32" x2="36" y2="42"/></g></svg>`;
  }
  if (code >= 71 && code <= 77) {
    return `<svg width="40" height="34" viewBox="0 0 56 44">${cloudGray}<g fill="#e8eeff"><circle cx="16" cy="36" r="2.2"/><circle cx="28" cy="39" r="2.2"/><circle cx="40" cy="36" r="2.2"/></g></svg>`;
  }
  return `<svg width="40" height="34" viewBox="0 0 56 44">${cloudGray}<path d="M27 30 L20 39 L26 39 L22 46 L34 34 L27 34 Z" fill="#ffd166"/></svg>`;
}
async function loadWeather() {
  try {
    const lat = 28.5653, lon = -81.5862;
    const url = `https://api.open-meteo.com/v1/gfs?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,is_day&hourly=temperature_2m,weathercode,is_day,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=2&timezone=America%2FNew_York`;
    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current;
    document.getElementById("weather-icon").innerHTML = weatherIconSvg(cur.weathercode, cur.is_day === 1);
    document.getElementById("weather-temp").textContent = Math.round(cur.temperature_2m) + "°F";

    const todayHigh = Math.round(data.daily.temperature_2m_max[0]);
    const todayLow = Math.round(data.daily.temperature_2m_min[0]);

    const now = new Date();
    const hours = data.hourly.time;
    const precipProbs = data.hourly.precipitation_probability;
    let count = 0;
    let maxPrecip6 = -1;
    for (let i = 0; i < hours.length && count < 6; i++) {
      const t = new Date(hours[i]);
      if (t > now) {
        const precip = precipProbs[i] ?? 0;
        if (precip > maxPrecip6) maxPrecip6 = precip;
        count++;
      }
    }
    const pct6 = Math.round(Math.max(maxPrecip6, 0));
    document.getElementById("weather-hilo").textContent = `H${todayHigh} L${todayLow} · ${pct6}% rain`;
  } catch(e) {
    document.getElementById("weather-temp").textContent = "—°";
    document.getElementById("weather-hilo").textContent = "unavailable";
  }
}

  const dd = String(dt.getDate()).padStart(2, "0");

}

      <div class="card-body">
        <div class="card-row1">
          <div class="card-name" style="display:flex;align-items:center;gap:10px;">${item.featured ? `<svg width="28" height="18" viewBox="0 0 28 18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;margin-top:1px;border-radius:2px;cursor:pointer;" class="flag-btn" data-id="${item.id}"><rect width="28" height="18" fill="#b22234"/><rect y="1.38" width="28" height="1.38" fill="#fff"/><rect y="2.77" width="28" height="1.38" fill="#b22234"/><rect y="4.15" width="28" height="1.38" fill="#fff"/><rect y="5.54" width="28" height="1.38" fill="#b22234"/><rect y="6.92" width="28" height="1.38" fill="#fff"/><rect y="8.31" width="28" height="1.38" fill="#b22234"/><rect y="9.69" width="28" height="1.38" fill="#fff"/><rect y="11.08" width="28" height="1.38" fill="#b22234"/><rect y="12.46" width="28" height="1.38" fill="#fff"/><rect y="13.85" width="28" height="1.38" fill="#b22234"/><rect y="15.23" width="28" height="1.38" fill="#fff"/><rect y="16.62" width="28" height="1.38" fill="#b22234"/><rect width="11" height="9.69" fill="#3c3b6e"/><text font-size="1.6" fill="white" text-anchor="middle"><tspan x="1.4" y="2.2">&#x2605;</tspan><tspan x="3.6" y="2.2">&#x2605;</tspan><tspan x="5.8" y="2.2">&#x2605;</tspan><tspan x="8" y="2.2">&#x2605;</tspan><tspan x="10.2" y="2.2">&#x2605;</tspan><tspan x="2.5" y="3.8">&#x2605;</tspan><tspan x="4.7" y="3.8">&#x2605;</tspan><tspan x="6.9" y="3.8">&#x2605;</tspan><tspan x="9.1" y="3.8">&#x2605;</tspan><tspan x="1.4" y="5.4">&#x2605;</tspan><tspan x="3.6" y="5.4">&#x2605;</tspan><tspan x="5.8" y="5.4">&#x2605;</tspan><tspan x="8" y="5.4">&#x2605;</tspan><tspan x="10.2" y="5.4">&#x2605;</tspan><tspan x="2.5" y="7">&#x2605;</tspan><tspan x="4.7" y="7">&#x2605;</tspan><tspan x="6.9" y="7">&#x2605;</tspan><tspan x="9.1" y="7">&#x2605;</tspan><tspan x="1.4" y="8.6">&#x2605;</tspan><tspan x="3.6" y="8.6">&#x2605;</tspan><tspan x="5.8" y="8.6">&#x2605;</tspan><tspan x="8" y="8.6">&#x2605;</tspan><tspan x="10.2" y="8.6">&#x2605;</tspan></text></svg>` : `<svg width="28" height="18" viewBox="0 0 28 18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;margin-top:1px;border-radius:2px;cursor:pointer;opacity:0.15;" class="flag-btn" data-id="${item.id}"><rect width="28" height="18" fill="#b22234"/><rect y="1.38" width="28" height="1.38" fill="#fff"/><rect y="2.77" width="28" height="1.38" fill="#b22234"/><rect y="4.15" width="28" height="1.38" fill="#fff"/><rect y="5.54" width="28" height="1.38" fill="#b22234"/><rect y="6.92" width="28" height="1.38" fill="#fff"/><rect y="8.31" width="28" height="1.38" fill="#b22234"/><rect y="9.69" width="28" height="1.38" fill="#fff"/><rect y="11.08" width="28" height="1.38" fill="#b22234"/><rect y="12.46" width="28" height="1.38" fill="#fff"/><rect y="13.85" width="28" height="1.38" fill="#b22234"/><rect y="15.23" width="28" height="1.38" fill="#fff"/><rect y="16.62" width="28" height="1.38" fill="#b22234"/><rect width="11" height="9.69" fill="#3c3b6e"/></svg>`}<span>${item.person}</span></div>
        </div>
        <div class="card-row2">
          <span class="card-meta">${metaParts}</span>
        </div>
      </div>
      ${nxt ? `<div class="card-band"><span class="card-band-label">Next</span><span class="card-band-text">${nxt}</span></div>` : ""}
      ${item.status !== "Done" ? `
      <div class="card-footer-row">
        <button class="quick-btn" data-id="${item.id}">⚡ Quick Update</button>
        <span class="sep" style="margin-left:8px;">·</span>
        <span class="status-badge ${statusClass(item.status)}"><span class="status-dot"></span>Status: ${item.status}</span>
        ${item.followUpDate ? `<span class="sep">·</span>${followChipHtml(item.followUpDate)}` : ""}
        <span style="margin-left:auto;display:flex;align-items:center;gap:4px;">${touchHtml}</span>
      </div>` : `
      <div class="card-footer-row">
        <span class="status-badge ${statusClass(item.status)}"><span class="status-dot"></span>Status: ${item.status}</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:4px;">${touchHtml}</span>
      </div>`}
    </div>`;
  }).join("");

  pane.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".quick-btn") || e.target.closest(".flag-btn")) return;
      const clickedId = parseInt(card.dataset.id);
      selectedId = (selectedId === clickedId) ? null : clickedId;
      isAdding = false;
      editingItem = null;
      render();
    });
  });

  pane.querySelectorAll(".quick-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      openQuick(parseInt(btn.dataset.id));
    });
  });

  pane.querySelectorAll(".flag-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.featured = !item.featured;
      await upsert(item);
      renderList();
    });
  });
}

function renderPanel() {
  const detail = document.getElementById("detail-pane");
  const editP = document.getElementById("edit-pane");

  if (isAdding || editingItem) {
    detail.className = "";
    editP.className = "open";
    renderEditForm();
    return;
  }

  editP.className = "";

  if (!selectedId) {
    detail.className = "";
    return;
  }

  const item = items.find(i => i.id === selectedId);
  if (!item) { detail.className = ""; return; }

  detail.className = "open";
  const metaParts = [item.company, item.customerType, item.type].filter(Boolean).join(" · ");
        const starHtml = item.featured ? '<span style="color:#c8a96e;font-size:14px;margin-right:3px;">★</span>' : '';

  detail.innerHTML = `
    <div class="icon-dock-row top"><div class="icon-dock">${iconDockHtml(item)}</div></div>
    ${item.nextAction ? `<div class="section-box box-next"><div class="field-label">Next Action</div><div class="field-content">${item.nextAction}</div></div>` : ""}
    <div class="section-box box-tasks">
      <div class="field-label">Things To Be Done</div>
      <div class="task-section">
        <ul class="task-list" id="task-list"></ul>
        <div class="task-add-row">
          <input class="task-add-input" id="task-input" placeholder="Add a task..." />
          <button class="task-add-btn" id="task-add-btn">+ Add</button>
        </div>
      </div>
    </div>
    ${item.context ? `<div class="section-box box-context"><div class="field-label">Context</div><div class="field-content">${item.context}</div></div>` : ""}
    ${item.lastAction ? `<div class="section-box box-last"><div class="field-label">Last Action</div><div class="field-content">${item.lastAction}</div></div>` : ""}
    <div class="section-box box-touch"><div class="field-label">Last Touch</div><div class="field-content" style="color:var(--ink-2)">${fmtDate(item.date)}</div></div>
    ${item.notes ? `<div class="section-box box-notes"><div class="field-label">Notes</div><div class="field-content" style="color:var(--ink-2)">${item.notes}</div></div>` : ""}
    <div class="icon-dock-row bottom"><div class="icon-dock">${iconDockHtml(item)}</div></div>`;

  // Render tasks
  function renderTasks() {
    const taskList = document.getElementById("task-list");
    if (!taskList) return;
    const tasks = item.tasks || [];
    taskList.innerHTML = tasks.map((t, i) => `
      <li class="task-item">
        <input type="checkbox" class="task-check" data-idx="${i}" ${t.done ? "checked" : ""} />
        <div style="flex:1">
          <div class="task-text${t.done ? " done" : ""}">${t.text}</div>
          <div class="task-dates">
            Added ${t.created}${t.done && t.completed ? ` · Done ${t.completed}` : ""}
          </div>
        </div>
      </li>`).join("");

    taskList.querySelectorAll(".task-check").forEach(cb => {
      cb.addEventListener("change", async () => {
        const idx = parseInt(cb.dataset.idx);
        const tasks = item.tasks || [];
        tasks[idx].done = cb.checked;
        tasks[idx].completed = cb.checked ? todayStr() : null;
        item.tasks = tasks;
        items = items.map(i => i.id === item.id ? item : i);
        await upsert(item);
        renderTasks();
      });
    });
  }
  renderTasks();

  // Add task handler
  function addTask() {
    const input = document.getElementById("task-input");
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const tasks = item.tasks || [];
    tasks.push({ text, done: false, created: todayStr(), completed: null });
    item.tasks = tasks;
    items = items.map(i => i.id === item.id ? item : i);
    input.value = "";
    upsert(item);
    renderTasks();
  }

  const addBtn = document.getElementById("task-add-btn");
  const taskInput = document.getElementById("task-input");
  if (addBtn) addBtn.onclick = addTask;
  if (taskInput) taskInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  detail.querySelectorAll('[data-action="back"]').forEach(b => {
    b.onclick = () => { selectedId = null; render(); };
  });
  detail.querySelectorAll('[data-action="edit"]').forEach(b => {
    b.onclick = () => { editingItem = item; render(); };
  });
  detail.querySelectorAll('[data-action="delete"]').forEach(b => {
    b.onclick = async () => {
      await remove(item.id);
      items = items.filter(i => i.id !== item.id);
      selectedId = null;
      render();
    };
  });
  detail.querySelectorAll('[data-action="close"]').forEach(b => {
    b.onclick = async () => {
      item.status = "Done";
      await upsert(item);
      selectedId = null;
      render();
    };
  });
}

function renderEditForm() {
  const pane = document.getElementById("edit-pane");
  const item = editingItem || {};
  const isNew = isAdding;

  pane.innerHTML = `
    <div class="form-title">${isNew ? "New Item" : "Edit Item"}</div>
    <div class="icon-dock-row top"><div class="icon-dock">${formIconDockHtml()}</div></div>
    <div class="form-field"><label class="form-label">Person</label><input class="form-input" id="f-person" value="${item.person||""}" placeholder="Name" /></div>
    <div class="form-field"><label class="form-label">Company</label><input class="form-input" id="f-company" value="${item.company||""}" placeholder="Company or team" /></div>
    <div class="form-field"><label class="form-label">Context (why it's on your list)</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-context")}</div><div class="rte-body" id="f-context" contenteditable="true">${item.context||""}</div></div></div>
    <div class="form-field"><label class="form-label">Last Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-lastAction")}</div><div class="rte-body" id="f-lastAction" contenteditable="true">${item.lastAction||""}</div></div></div>
    <div class="form-field"><label class="form-label">Next Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-nextAction")}</div><div class="rte-body" id="f-nextAction" contenteditable="true">${item.nextAction||""}</div></div></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Status</label><select class="form-input" id="f-status">${STATUSES.map(s => `<option${(item.status||"I Need To Act")===s?" selected":""}>${s}</option>`).join("")}</select></div>
      <div class="form-field"><label class="form-label">Customer Type</label><select class="form-input" id="f-customerType"><option value="">Not set</option><option${item.customerType==="Prospect"?" selected":""}>Prospect</option><option${item.customerType==="Current Customer"?" selected":""}>Current Customer</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Type</label><select class="form-input" id="f-type"><option value="">Not set</option>${TYPES.map(t => `<option${item.type===t?" selected":""}>${t}</option>`).join("")}</select></div>
      <div class="form-field"><label class="form-label">Co-Workers Involved</label><input class="form-input" id="f-coWorkers" value="${item.coWorkers||""}" placeholder="Names" /></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Follow-up Date</label><input type="date" class="form-input" id="f-followUpDate" value="${item.followUpDate||""}" /></div>
      <div class="form-field"><label class="form-label">Last Touch Date</label><input type="date" class="form-input" id="f-date" value="${item.date||todayStr()}" /></div>
    </div>
    <div class="form-field"><label class="form-label">Notes</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-notes")}</div><div class="rte-body" id="f-notes" contenteditable="true" style="min-height:100px">${item.notes||""}</div></div></div>
    <div class="icon-dock-row bottom"><div class="icon-dock">${formIconDockHtml()}</div></div>`;

  setupRteToolbars();

  pane.querySelectorAll('[data-form-action="save"]').forEach(b => { b.onclick = async () => {
    const newStatus = document.getElementById("f-status").value;
    const oldStatus = item.status || "";
    const statusChanged = !isNew && newStatus !== oldStatus;

    const updated = {
      id: isNew ? Date.now() : item.id,
      person: document.getElementById("f-person").value,
      company: document.getElementById("f-company").value,
      context: document.getElementById("f-context").innerHTML,
      lastAction: document.getElementById("f-lastAction").innerHTML,
      nextAction: document.getElementById("f-nextAction").innerHTML,
      status: newStatus,
      coWorkers: document.getElementById("f-coWorkers").value,
      customerType: document.getElementById("f-customerType").value,
      type: document.getElementById("f-type").value,
      followUpDate: document.getElementById("f-followUpDate").value || null,
      date: document.getElementById("f-date").value,
      notes: document.getElementById("f-notes").innerHTML,
      category: item.category || "Commitment",
      tasks: item.tasks || []
    };
    await upsert(updated);
    if (isNew) { items.push(updated); selectedId = updated.id; }
    else { items = items.map(i => i.id === updated.id ? updated : i); selectedId = updated.id; }
    isAdding = false; editingItem = null;

    if (statusChanged) {
      // Show status change prompt
      const modal = document.getElementById("status-change-modal");
      document.getElementById("scm-title").textContent = `Status changed to "${newStatus}"`;
      document.getElementById("scm-sub").textContent = "Do you want to update the follow-up date?";
      document.getElementById("scm-next").value = updated.followUpDate || "";
      const clearWrap = document.getElementById("scm-cleardate-wrap");
      clearWrap.style.display = newStatus === "Done" ? "block" : "none";
      modal.style.display = "flex";

      document.getElementById("scm-save").onclick = async () => {
        if (newStatus === "Done" && document.getElementById("scm-cleardate").checked) {
          updated.followUpDate = null;
        } else {
          updated.followUpDate = document.getElementById("scm-next").value || null;
        }
        await upsert(updated);
        items = items.map(i => i.id === updated.id ? updated : i);
        modal.style.display = "none";
        render();
      };
      document.getElementById("scm-skip").onclick = () => {
        modal.style.display = "none";
        render();
      };
    } else {
      render();
    }
  }; });

  pane.querySelectorAll('[data-form-action="cancel"]').forEach(b => {
    b.onclick = () => {
      isAdding = false; editingItem = null;
      render();
    };
  });
}

function rteToolbar(fieldId) {
  return `<button class="rte-btn" data-cmd="bold" data-field="${fieldId}"><b>B</b></button>
    <button class="rte-btn" data-cmd="italic" data-field="${fieldId}"><i>I</i></button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="insertUnorderedList" data-field="${fieldId}">• List</button>
    <button class="rte-btn" data-cmd="insertOrderedList" data-field="${fieldId}">1. List</button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="removeFormat" data-field="${fieldId}">Clear</button>`;
}

function setupRteToolbars() {
  document.querySelectorAll(".rte-btn[data-cmd]").forEach(btn => {
    btn.onmousedown = e => {
      e.preventDefault();
      const field = document.getElementById(btn.dataset.field);
      field.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    };
  });
}

// Quick update
function openQuick(id) {
  quickItem = items.find(i => i.id === id);
  if (!quickItem) return;
  document.getElementById("quick-name").textContent = quickItem.person;
  document.getElementById("quick-company").textContent = quickItem.company;
  document.getElementById("quick-note").value = "";
  document.getElementById("quick-date").value = quickItem.followUpDate || "";
  const sel = document.getElementById("quick-status");
  sel.innerHTML = STATUSES.map(s => `<option${quickItem.status===s?" selected":""}>${s}</option>`).join("");
  document.getElementById("quick-modal").className = "open";
}

document.getElementById("quick-save").onclick = async () => {
  const note = document.getElementById("quick-note").value.trim();
  const today = todayStr();
  let lastAction = quickItem.lastAction || "";
  if (note) {
    const noteHtml = `<p><em><strong>${fmtDate(today)}:</strong> ${note}</em></p>`;
    lastAction = noteHtml + lastAction;
  }
  const updated = { ...quickItem, lastAction, status: document.getElementById("quick-status").value, followUpDate: document.getElementById("quick-date").value, date: today };
  await upsert(updated);
  items = items.map(i => i.id === updated.id ? updated : i);
  document.getElementById("quick-modal").className = "";
  quickItem = null;
  render();
};

document.getElementById("quick-cancel").onclick = () => { document.getElementById("quick-modal").className = ""; quickItem = null; };
document.getElementById("quick-modal").onclick = e => { if (e.target === document.getElementById("quick-modal")) { document.getElementById("quick-modal").className = ""; quickItem = null; } };

// Search
document.getElementById("search-input").addEventListener("input", e => {
  searchQuery = e.target.value;
  document.getElementById("search-clear").style.display = searchQuery ? "block" : "none";
  renderList();
});
document.getElementById("search-clear").onclick = () => {
  searchQuery = ""; document.getElementById("search-input").value = "";
  document.getElementById("search-clear").style.display = "none";
  renderList();
};

// Add btn
document.getElementById("add-btn").onclick = () => { isAdding = true; editingItem = null; selectedId = null; render(); };

// Overdue bar


// Init
if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById("panel-0").style.display = "none";
  loadItems();
}
</script>
</body>
</html>
