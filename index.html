<!DOCTYPE html><!-- v5.2 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Work Tracker" />
  <title>Work Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:         #f2f0eb;
      --surface:    #ffffff;
      --surface-alt:#f7f6f3;
      --border:     #e5e3dc;
      --border-mid: #ccc9c0;
      --ink:        #1c1b18;
      --ink-2:      #4a4843;
      --ink-3:      #8a8880;
      --accent:     #166a28;
      --accent-bg:  #dcfce7;
      --accent-bd:  #86efac;
      --amber:      #78350f;
      --amber-bg:   #fde68a;
      --red:        #991b1b;
      --red-bg:     #fecaca;
      --red-bd:     #f87171;
      --gray-bg:    #e5e7eb;
      --gray-ink:   #374151;
      --radius:     8px;
      --radius-sm:  6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: var(--bg); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; color: var(--ink); font-size: 15px; }

    /* Lock */
    #panel-0 { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
    #panel-1 { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px 32px; width: 300px; text-align: center; }
    #panel-1 h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    #panel-1 p  { font-size: 12px; color: var(--ink-3); margin-bottom: 22px; }
    #field-2 { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 12px; font-family: inherit; background: var(--surface-alt); transition: border-color .15s; }
    #field-2:focus { border-color: var(--accent); }
    #btn-3 { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }

    /* Header */
    #header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 18px; display: flex; align-items: center; justify-content: space-between; height: 56px; flex-shrink: 0; }
    #header-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
    #header-sub   { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
    #add-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

    /* Filter bar — tabs + overdue pill */
    #filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 18px; display: flex; align-items: center; height: 44px; flex-shrink: 0; gap: 2px; }
    .tab-btn { border: none; background: none; padding: 8px 12px; font-size: 13px; font-weight: 400; color: var(--ink-3); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .tab-btn.active { font-weight: 700; color: var(--ink); border-bottom-color: var(--accent); }
    #overdue-pill { margin-left: auto; background: var(--red-bg); color: var(--red); font-size: 12px; font-weight: 700; border-radius: 20px; padding: 5px 12px; cursor: pointer; white-space: nowrap; border: none; font-family: inherit; }
    #overdue-pill.hidden { display: none; }

    /* Search row — hidden until icon tapped (future) */
    #search-bar { background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; display: none; }
    #search-bar.open { display: flex; align-items: center; gap: 8px; padding: 7px 14px; }
    #search-input { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; font-family: inherit; color: var(--ink); }
    #search-input::placeholder { color: var(--ink-3); }
    #search-clear { border: none; background: none; color: var(--ink-3); font-size: 14px; cursor: pointer; display: none; padding: 0; }

    /* Main */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* List pane — rows not cards */
    #list-pane { width: 100%; overflow-y: auto; padding: 10px; background: var(--bg); transition: width .2s; }
    #list-pane.narrow { width: 42%; min-width: 170px; }
    .sect-hdr { font-size: 10px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .7px; padding: 8px 4px 5px; }
    .row-group { background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; }
    .item-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: var(--surface-alt); }
    .item-row.sel { background: var(--accent-bg); border-left: 4px solid var(--accent); padding-left: 10px; }
    .item-row.done { opacity: .4; }
    .star-btn { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--border-mid); padding: 0; flex-shrink: 0; line-height: 1; }
    .star-btn.on { color: var(--accent); }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub  { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .quick-row-btn { border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink-2); border-radius: 5px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .quick-row-btn:hover { background: var(--accent-bg); border-color: var(--accent-bd); color: var(--accent); }

    /* Badges */
    .badge { font-size: 12px; font-weight: 700; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
    .b-act  { background: var(--accent-bg); color: #14532d; }
    .b-wait { background: var(--amber-bg); color: var(--amber); }
    .b-stuck{ background: var(--red-bg); color: var(--red); }
    .b-done { background: var(--gray-bg); color: var(--gray-ink); }
    .b-pri-H{ background: var(--red-bg); color: var(--red); }
    .b-pri-M{ background: var(--amber-bg); color: var(--amber); }
    .b-pri-L{ background: var(--gray-bg); color: var(--gray-ink); }
    .fu-overdue { font-size: 12px; font-weight: 700; color: var(--red); }
    .fu-today   { font-size: 12px; font-weight: 700; color: var(--accent); }
    .fu-soon    { font-size: 12px; color: var(--amber); }
    .fu-normal  { font-size: 12px; color: var(--ink-3); }

    /* Detail pane — 3-zone: head / body / footer */
    #detail-pane { flex: 1; background: var(--surface); border-left: 1px solid var(--border); display: none; flex-direction: column; overflow: hidden; }
    #detail-pane.open { display: flex; }
    .dp-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .dp-name { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; margin-bottom: 3px; }
    .dp-meta { font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
    .dp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .dp-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
    .dp-foot { padding: 10px 18px; border-top: 1px solid var(--border); display: flex; gap: 7px; align-items: center; flex-shrink: 0; }

    /* Field blocks in detail */
    .field-block { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-3); }
    .field-content { font-size: 15px; color: var(--ink); line-height: 1.6; }
    .field-content ul, .field-content ol { padding-left: 18px; margin: 2px 0; }
    .field-content li { margin: 1px 0; }
    .field-content b, .field-content strong { font-weight: 700; }
    .field-content i, .field-content em { font-style: italic; }
    .field-content p { margin: 0 0 2px; }
    .next-box { background: var(--accent-bg); border: 1px solid var(--accent-bd); border-radius: var(--radius-sm); padding: 10px 13px; }
    .field-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 13px; }
    .notes-inner { background: var(--surface-alt); color: var(--ink-2); }

    /* Detail footer buttons */
    .btn { border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-edit   { background: var(--ink); color: #fff; }
    .btn-back   { background: var(--surface-alt); color: var(--ink-2); border: 1px solid var(--border); }
    .btn-close  { background: var(--accent-bg); color: #14532d; border: 1px solid var(--accent-bd); }
    .btn-delete { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }
    .btn-quick  { background: var(--surface-alt); color: var(--ink-2); border: 1px solid var(--border); margin-left: auto; }

    /* Edit pane */
    #edit-pane { flex: 1; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 18px 16px; display: none; }
    #edit-pane.open { display: block; }
    .form-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
    .form-field { margin-bottom: 11px; }
    .form-label { font-size: 10px; font-weight: 700; color: var(--ink-3); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .6px; display: block; }
    .form-input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit; background: var(--surface-alt); color: var(--ink); transition: border-color .15s; }
    .form-input:focus { border-color: var(--accent); background: var(--surface); }
    .form-row { display: flex; gap: 8px; margin-bottom: 11px; }
    .form-row .form-field { flex: 1; margin-bottom: 0; }
    .form-btns { display: flex; gap: 8px; }
    .rte-wrap { border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: border-color .15s; }
    .rte-wrap:focus-within { border-color: var(--accent); }
    .rte-toolbar { display: flex; gap: 4px; padding: 4px 6px; background: var(--surface-alt); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .rte-btn { border: none; background: transparent; padding: 3px 7px; border-radius: 4px; font-size: 12px; cursor: pointer; color: var(--ink-2); font-family: inherit; line-height: 1.4; }
    .rte-btn:hover { background: var(--border); }
    .rte-sep { width: 1px; background: var(--border); margin: 2px; }
    .rte-body { padding: 9px 11px; font-size: 13px; min-height: 80px; outline: none; line-height: 1.6; background: var(--surface); color: var(--ink); }
    .rte-body ul, .rte-body ol { padding-left: 18px; margin: 2px 0; }
    .rte-body li { margin: 1px 0; }

    /* Quick modal */
    #quick-modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
    #quick-modal.open { display: flex; }
    #quick-box { background: var(--surface); width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; padding: 20px 18px 32px; }
    #quick-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 0 auto 18px; }
    #quick-name    { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    #quick-company { font-size: 12px; color: var(--ink-3); margin-bottom: 16px; }
    .quick-field   { margin-bottom: 12px; }
    .quick-label   { font-size: 10px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; display: block; }
    .quick-input   { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit; background: var(--surface-alt); transition: border-color .15s; }
    .quick-input:focus { border-color: var(--accent); }
    #quick-row     { display: flex; gap: 8px; margin-bottom: 16px; }
    #quick-row .quick-field { flex: 1; margin-bottom: 0; }
    #quick-save    { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    #quick-cancel  { flex: 1; background: var(--surface-alt); color: var(--ink-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
    #quick-btns    { display: flex; gap: 8px; }

    /* Tasks */
    .task-section { display: flex; flex-direction: column; gap: 4px; }
    .task-list { list-style: none; padding: 0; margin: 0 0 6px; }
    .task-item { display: flex; align-items: flex-start; gap: 9px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .task-item:last-child { border-bottom: none; }
    .task-check { width: 15px; height: 15px; margin-top: 2px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
    .task-text  { flex: 1; font-size: 13px; color: var(--ink); line-height: 1.4; }
    .task-text.done { text-decoration: line-through; color: var(--ink-3); }
    .task-dates { font-size: 10px; color: var(--border-mid); white-space: nowrap; margin-top: 1px; }
    .task-add-row { display: flex; gap: 6px; margin-top: 4px; }
    .task-add-input { flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px; outline: none; font-family: inherit; background: var(--surface-alt); transition: border-color .15s; }
    .task-add-input:focus { border-color: var(--accent); }
    .task-add-btn { background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); padding: 7px 13px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }

    /* Search icon in header */
    #search-toggle { border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink-2); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; margin-right: 8px; }

    #version { position: fixed; bottom: 6px; right: 10px; font-size: 9px; color: var(--border-mid); pointer-events: none; z-index: 999; }
    .loading-msg { padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }
  </style>
</head>
<body>

</div>

<div id="header">

    <div id="header-title">Work Tracker</div>

</div>

<div id="search-bar">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;color:var(--ink-3)"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

</div>

<div id="version">v5.2</div>

<script>
const x9f2 = "karvox-7Hunjit-plwesk";
const SESSION_KEY = "wt-auth";
const SUPABASE_URL = "https://whyklzysiavybgxltjzt.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoeWtsenlzaWF2eWJneGx0anp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODIyODEsImV4cCI6MjA5Njc1ODI4MX0.x7yEeWHDhwgZreDP-SME3dWIC-B-kthc4EC0YOuphIg";
const TABLE = "work_tracker_items";
const STATUSES = ["I Need To Act","Waiting On Them","Stuck","Done"];
const PRIORITIES = ["High","Medium","Low"];
const TYPES = ["Sales Opportunity","Renewal","Escalation","Internal"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let items = [];
let selectedId = null;
let filterStatus = "All";
let searchQuery = "";
let quickItem = null;
let editingItem = null;
let isAdding = false;

// Lock screen
if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById("panel-0").style.display = "none";
}
document.getElementById("btn-3").onclick = () => {
  if (document.getElementById("field-2").value === x9f2) {
    sessionStorage.setItem(SESSION_KEY, "1");
    document.getElementById("panel-0").style.display = "none";
    loadItems();
  } else {
    document.getElementById("field-2").style.border = "1px solid #c03030";
    document.getElementById("field-2").value = "";
    setTimeout(() => document.getElementById("field-2").style.border = "1.5px solid var(--border)", 2000);
  }
};
document.getElementById("field-2").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-3").click(); });

// Helpers
function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString("en-US", {month:"short", day:"numeric"});
}
function daysUntil(d) {
  if (!d) return null;
  const now = new Date();
  const local = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d + "T00:00:00");
  return Math.round((target - local) / 86400000);
}
function stripHtml(html) {
  if (!html) return "";
  return html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function statusClass(s) {
  if (s === "I Need To Act") return "s-act";
  if (s === "Waiting On Them") return "s-wait";
  if (s === "Stuck") return "s-stuck";
  return "s-done";
}
function followChipHtml(date) {
  if (!date) return "";
  const days = daysUntil(date);
  if (days < 0) return `<span class="follow-chip follow-overdue">↻ ${Math.abs(days)}d overdue</span>`;
  if (days === 0) return `<span class="follow-chip follow-today">↻ Today</span>`;
  if (days <= 2) return `<span class="follow-chip follow-soon">↻ ${days}d</span>`;
  return `<span class="follow-chip follow-normal">↻ ${days}d</span>`;
}

// Load
async function loadItems() {
  const { data, error } = await sb.from(TABLE).select("*");
  if (!error && data) {
    items = data;
    render();
  }
}

// Save
async function upsert(item) { await sb.from(TABLE).upsert(item); }
async function remove(id) { await sb.from(TABLE).delete().eq("id", id); }

// Render
function getFiltered() {
  let f;
  if (filterStatus === "Overdue") {
    f = items.filter(i => i.status !== "Done" && i.followUpDate && daysUntil(i.followUpDate) < 0);
  } else {
    f = items.filter(i => filterStatus === "All" || i.status === filterStatus);
  }
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    f = f.filter(i =>
      (i.person||"").toLowerCase().includes(q) ||
      (i.company||"").toLowerCase().includes(q) ||
      stripHtml(i.context||"").toLowerCase().includes(q) ||
      (i.coWorkers||"").toLowerCase().includes(q)
    );
  }
  return f.sort((a, b) => {
    if (a.status === "Done" && b.status !== "Done") return 1;
    if (b.status === "Done" && a.status !== "Done") return -1;
    if (a.featured && !b.featured) return -1;
    if (b.featured && !a.featured) return 1;
    const fa = a.followUpDate ? new Date(a.followUpDate) : new Date("9999-12-31");
    const fb = b.followUpDate ? new Date(b.followUpDate) : new Date("9999-12-31");
    return fa - fb;
  });
}

function render() {
  renderHeader();
  renderOverdue();
  renderTabs();
  renderList();
  renderPanel();
}

function renderHeader() {
  const open = items.filter(i => i.status !== "Done").length;
  const closed = items.filter(i => i.status === "Done").length;
  document.getElementById("header-sub").textContent = `${open} open · ${closed} closed`;
}

function renderOverdue() {
  const count = items.filter(i => i.status !== "Done" && i.followUpDate && daysUntil(i.followUpDate) < 0).length;
  const pill = document.getElementById("overdue-pill");
  if (count > 0) {
    pill.textContent = `↻ ${count} overdue`;
    pill.className = "";
  } else {
    pill.className = "hidden";
  }
}

function renderTabs() {
  const container = document.getElementById("status-tabs");
  const tabs = ["All", ...STATUSES];
  container.innerHTML = tabs.map(s => `<button class="tab-btn${filterStatus === s ? " active" : ""}" data-status="${s}">${s}</button>`).join("");
  container.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { filterStatus = btn.dataset.status; render(); };
  });
}

function renderList() {
  const pane = document.getElementById("list-pane");
  const panelOpen = selectedId || isAdding;
  pane.className = panelOpen ? "narrow" : "";

  const filtered = getFiltered();
  if (filtered.length === 0) {
    pane.innerHTML = `<div class="loading-msg">${searchQuery ? "No results." : "Nothing here yet."}</div>`;
    return;
  }

  const starred = filtered.filter(i => i.featured);
  const rest    = filtered.filter(i => !i.featured);

  function rowHtml(item) {
    const meta = [item.company, item.customerType, item.type].filter(Boolean).join(" · ");
    const sc = statusClass(item.status);
    const badgeCls = sc === "s-act" ? "b-act" : sc === "s-wait" ? "b-wait" : sc === "s-stuck" ? "b-stuck" : "b-done";
    const statusLabel = item.status === "I Need To Act" ? "Act" : item.status === "Waiting On Them" ? "Waiting" : item.status;
    const days = item.followUpDate ? daysUntil(item.followUpDate) : null;
    let fuHtml = "";
    if (days !== null) {
      if (days < 0)      fuHtml = `<span class="fu-overdue">↻ ${Math.abs(days)}d overdue</span>`;
      else if (days === 0) fuHtml = `<span class="fu-today">↻ Today</span>`;
      else if (days <= 3)  fuHtml = `<span class="fu-soon">${fmtDate(item.followUpDate)}</span>`;
      else                 fuHtml = `<span class="fu-normal">${fmtDate(item.followUpDate)}</span>`;
    }
    return `<div class="item-row${selectedId === item.id ? " sel" : ""}${item.status === "Done" ? " done" : ""}" data-id="${item.id}">
      <button class="star-btn${item.featured ? " on" : ""}" data-id="${item.id}">★</button>
      <div class="row-main">
        <div class="row-name">${item.person}</div>
        <div class="row-sub">${meta}</div>
      </div>
      <div class="row-right">
        <span class="badge ${badgeCls}">${statusLabel}</span>
        ${fuHtml}
        ${item.status !== "Done" ? `<button class="quick-row-btn" data-id="${item.id}">⚡ Update</button>` : ""}
      </div>
    </div>`;
  }

  let html = "";
  if (starred.length > 0) {
    html += `<div class="sect-hdr">Starred</div><div class="row-group">${starred.map(rowHtml).join("")}</div>`;
  }
  if (rest.length > 0) {
    html += `<div class="sect-hdr">${starred.length > 0 ? "All items" : ""}</div><div class="row-group">${rest.map(rowHtml).join("")}</div>`;
  }
  pane.innerHTML = html;

  pane.querySelectorAll(".item-row").forEach(row => {
    row.addEventListener("click", e => {
      if (e.target.closest(".star-btn") || e.target.closest(".quick-row-btn")) return;
      const clickedId = parseInt(row.dataset.id);
      selectedId = (selectedId === clickedId) ? null : clickedId;
      isAdding = false; editingItem = null;
      render();
    });
  });

  pane.querySelectorAll(".quick-row-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      openQuick(parseInt(btn.dataset.id));
    });
  });

  pane.querySelectorAll(".star-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.featured = !item.featured;
      await upsert(item);
      renderList();
    });
  });
}

function renderPanel() {
  const detail = document.getElementById("detail-pane");
  const editP  = document.getElementById("edit-pane");

  if (isAdding || editingItem) {
    detail.className = "";
    editP.className = "open";
    renderEditForm();
    return;
  }

  editP.className = "";

  if (!selectedId) { detail.className = ""; return; }
  const item = items.find(i => i.id === selectedId);
  if (!item) { detail.className = ""; return; }

  detail.className = "open";
  const metaParts = [item.company, item.customerType, item.type].filter(Boolean).join(" · ");
  const sc = statusClass(item.status);
  const badgeCls = sc === "s-act" ? "b-act" : sc === "s-wait" ? "b-wait" : sc === "s-stuck" ? "b-stuck" : "b-done";

  const chipHtml = [
    `<span class="badge ${badgeCls}" style="font-size:11px;padding:3px 9px;">${item.status}</span>`,
    item.priority ? `<span class="badge b-pri-${item.priority[0]}" style="font-size:11px;padding:3px 9px;">${item.priority}</span>` : "",
    item.followUpDate ? `<span style="font-size:11px;padding:3px 9px;border-radius:20px;${daysUntil(item.followUpDate) < 0 ? 'background:var(--red-bg);color:var(--red);font-weight:600;' : 'background:var(--surface-alt);color:var(--ink-3);'}">↻ ${item.followUpDate ? fmtDate(item.followUpDate) : ''}</span>` : ""
  ].filter(Boolean).join("");

  detail.innerHTML = `
    <div class="dp-head">
      <div class="dp-name">${item.person}</div>
      <div class="dp-meta">${metaParts}${item.coWorkers ? " · " + item.coWorkers : ""}</div>
      <div class="dp-chips">${chipHtml}</div>
    </div>
    <div class="dp-body">
      ${item.nextAction ? `<div class="field-block"><div class="field-label">Next action</div><div class="next-box field-content">${item.nextAction}</div></div>` : ""}
      <div class="field-block">
        <div class="field-label">Things to be done</div>
        <div class="field-box">
          <ul class="task-list" id="task-list"></ul>
          <div class="task-add-row">
            <input class="task-add-input" id="task-input" placeholder="Add a task..." />
            <button class="task-add-btn" id="task-add-btn">+ Add</button>
          </div>
        </div>
      </div>
      ${item.context    ? `<div class="field-block"><div class="field-label">Context</div><div class="field-box field-content">${item.context}</div></div>` : ""}
      ${item.lastAction ? `<div class="field-block"><div class="field-label">Last action</div><div class="field-box field-content">${item.lastAction}</div></div>` : ""}
      <div class="field-block"><div class="field-label">Last touch</div><div class="field-box field-content" style="color:var(--ink-3)">${fmtDate(item.date)}</div></div>
      ${item.notes ? `<div class="field-block"><div class="field-label">Notes</div><div class="field-box notes-inner field-content">${item.notes}</div></div>` : ""}
    </div>
    <div class="dp-foot">
      <button class="btn btn-edit" id="btn-edit">Edit</button>
      ${item.status !== "Done" ? `<button class="btn btn-close" id="btn-close">Mark closed</button>` : ""}
      <button class="btn btn-delete" id="btn-delete">&#x1F5D1;</button>
      <button class="btn btn-quick" id="btn-quick">⚡ Quick update</button>
      <button class="btn btn-back" id="btn-back" style="margin-left:auto;">← Back</button>
    </div>`;

  function renderTasks() {
    const taskList = document.getElementById("task-list");
    if (!taskList) return;
    const tasks = item.tasks || [];
    taskList.innerHTML = tasks.map((t, i) => `
      <li class="task-item">
        <input type="checkbox" class="task-check" data-idx="${i}" ${t.done ? "checked" : ""} />
        <div style="flex:1">
          <div class="task-text${t.done ? " done" : ""}">${t.text}</div>
          <div class="task-dates">Added ${t.created}${t.done && t.completed ? " · Done " + t.completed : ""}</div>
        </div>
      </li>`).join("");
    taskList.querySelectorAll(".task-check").forEach(cb => {
      cb.addEventListener("change", async () => {
        const idx = parseInt(cb.dataset.idx);
        const tasks = item.tasks || [];
        tasks[idx].done = cb.checked;
        tasks[idx].completed = cb.checked ? todayStr() : null;
        item.tasks = tasks;
        items = items.map(i => i.id === item.id ? item : i);
        await upsert(item);
        renderTasks();
      });
    });
  }
  renderTasks();

  function addTask() {
    const input = document.getElementById("task-input");
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const tasks = item.tasks || [];
    tasks.push({ text, done: false, created: todayStr(), completed: null });
    item.tasks = tasks;
    items = items.map(i => i.id === item.id ? item : i);
    input.value = "";
    upsert(item);
    renderTasks();
  }

  const addBtn = document.getElementById("task-add-btn");
  const taskInput = document.getElementById("task-input");
  if (addBtn) addBtn.onclick = addTask;
  if (taskInput) taskInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  document.getElementById("btn-back").onclick = () => { selectedId = null; render(); };
  document.getElementById("btn-edit").onclick = () => { editingItem = item; render(); };
  document.getElementById("btn-quick").onclick = () => openQuick(item.id);
  document.getElementById("btn-delete").onclick = async () => {
    if (!confirm("Delete this item?")) return;
    await remove(item.id);
    items = items.filter(i => i.id !== item.id);
    selectedId = null;
    render();
  };
  const closeBtn = document.getElementById("btn-close");
  if (closeBtn) {
    closeBtn.onclick = async () => {
      item.status = "Done";
      await upsert(item);
      selectedId = null;
      render();
    };
  }
}
function renderEditForm() {
  const pane = document.getElementById("edit-pane");
  const item = editingItem || {};
  const isNew = isAdding;

  pane.innerHTML = `
    <div class="form-title">${isNew ? "New Item" : "Edit Item"}</div>
    <div class="form-field"><label class="form-label">Person</label><input class="form-input" id="f-person" value="${item.person||""}" placeholder="Name" /></div>
    <div class="form-field"><label class="form-label">Company</label><input class="form-input" id="f-company" value="${item.company||""}" placeholder="Company or team" /></div>
    <div class="form-field"><label class="form-label">Context (why it's on your list)</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-context")}</div><div class="rte-body" id="f-context" contenteditable="true">${item.context||""}</div></div></div>
    <div class="form-field"><label class="form-label">Last Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-lastAction")}</div><div class="rte-body" id="f-lastAction" contenteditable="true">${item.lastAction||""}</div></div></div>
    <div class="form-field"><label class="form-label">Next Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-nextAction")}</div><div class="rte-body" id="f-nextAction" contenteditable="true">${item.nextAction||""}</div></div></div>
    <div class="form-field"><label class="form-label">Status</label><select class="form-input" id="f-status">${STATUSES.map(s => `<option${(item.status||"I Need To Act")===s?" selected":""}>${s}</option>`).join("")}</select></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Co-Workers Involved</label><input class="form-input" id="f-coWorkers" value="${item.coWorkers||""}" placeholder="Names" /></div>
      <div class="form-field"><label class="form-label">Customer Type</label><select class="form-input" id="f-customerType"><option value="">Not set</option><option${item.customerType==="Prospect"?" selected":""}>Prospect</option><option${item.customerType==="Current Customer"?" selected":""}>Current Customer</option></select></div>
    </div>
    <div class="form-field"><label class="form-label">Type</label><select class="form-input" id="f-type"><option value="">Not set</option>${TYPES.map(t => `<option${item.type===t?" selected":""}>${t}</option>`).join("")}</select></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Priority</label><select class="form-input" id="f-priority">${PRIORITIES.map(p => `<option${(item.priority||"Medium")===p?" selected":""}>${p}</option>`).join("")}</select></div>
      <div class="form-field"><label class="form-label">Follow-up Date</label><input type="date" class="form-input" id="f-followUpDate" value="${item.followUpDate||""}" /></div>
    </div>
    <div class="form-field"><label class="form-label">Last Touch Date</label><input type="date" class="form-input" id="f-date" value="${item.date||todayStr()}" /></div>
    <div class="form-field"><label class="form-label">Notes</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-notes")}</div><div class="rte-body" id="f-notes" contenteditable="true" style="min-height:100px">${item.notes||""}</div></div></div>
    <div class="form-btns">
      <button class="btn btn-edit" id="f-save">Save</button>
      <button class="btn btn-back" id="f-cancel">Cancel</button>
    </div>`;

  setupRteToolbars();

  document.getElementById("f-save").onclick = async () => {
    const updated = {
      id: isNew ? Date.now() : item.id,
      person: document.getElementById("f-person").value,
      company: document.getElementById("f-company").value,
      context: document.getElementById("f-context").innerHTML,
      lastAction: document.getElementById("f-lastAction").innerHTML,
      nextAction: document.getElementById("f-nextAction").innerHTML,
      status: document.getElementById("f-status").value,
      coWorkers: document.getElementById("f-coWorkers").value,
      customerType: document.getElementById("f-customerType").value,
      type: document.getElementById("f-type").value,
      priority: document.getElementById("f-priority").value,
      followUpDate: document.getElementById("f-followUpDate").value,
      date: document.getElementById("f-date").value,
      notes: document.getElementById("f-notes").innerHTML,
      category: item.category || "Commitment",
      tasks: item.tasks || []
    };
    await upsert(updated);
    if (isNew) { items.push(updated); selectedId = updated.id; }
    else { items = items.map(i => i.id === updated.id ? updated : i); selectedId = updated.id; }
    isAdding = false; editingItem = null;
    render();
  };

  document.getElementById("f-cancel").onclick = () => {
    isAdding = false; editingItem = null;
    render();
  };
}

function rteToolbar(fieldId) {
  return `<button class="rte-btn" data-cmd="bold" data-field="${fieldId}"><b>B</b></button>
    <button class="rte-btn" data-cmd="italic" data-field="${fieldId}"><i>I</i></button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="insertUnorderedList" data-field="${fieldId}">• List</button>
    <button class="rte-btn" data-cmd="insertOrderedList" data-field="${fieldId}">1. List</button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="removeFormat" data-field="${fieldId}">Clear</button>`;
}

function setupRteToolbars() {
  document.querySelectorAll(".rte-btn[data-cmd]").forEach(btn => {
    btn.onmousedown = e => {
      e.preventDefault();
      const field = document.getElementById(btn.dataset.field);
      field.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    };
  });
}

// Quick update
function openQuick(id) {
  quickItem = items.find(i => i.id === id);
  if (!quickItem) return;
  document.getElementById("quick-name").textContent = quickItem.person;
  document.getElementById("quick-company").textContent = quickItem.company;
  document.getElementById("quick-note").value = "";
  document.getElementById("quick-date").value = quickItem.followUpDate || "";
  const sel = document.getElementById("quick-status");
  sel.innerHTML = STATUSES.map(s => `<option${quickItem.status===s?" selected":""}>${s}</option>`).join("");
  document.getElementById("quick-modal").className = "open";
}

document.getElementById("quick-save").onclick = async () => {
  const note = document.getElementById("quick-note").value.trim();
  const today = todayStr();
  let lastAction = quickItem.lastAction || "";
  if (note) {
    const noteHtml = `<p><em><strong>${fmtDate(today)}:</strong> ${note}</em></p>`;
    lastAction = noteHtml + lastAction;
  }
  const updated = { ...quickItem, lastAction, status: document.getElementById("quick-status").value, followUpDate: document.getElementById("quick-date").value, date: today };
  await upsert(updated);
  items = items.map(i => i.id === updated.id ? updated : i);
  document.getElementById("quick-modal").className = "";
  quickItem = null;
  render();
};

document.getElementById("quick-cancel").onclick = () => { document.getElementById("quick-modal").className = ""; quickItem = null; };
document.getElementById("quick-modal").onclick = e => { if (e.target === document.getElementById("quick-modal")) { document.getElementById("quick-modal").className = ""; quickItem = null; } };

// Search toggle
document.getElementById("search-toggle").onclick = () => {
  const bar = document.getElementById("search-bar");
  const isOpen = bar.classList.contains("open");
  bar.className = isOpen ? "" : "open";
  if (!isOpen) document.getElementById("search-input").focus();
  else { searchQuery = ""; document.getElementById("search-input").value = ""; renderList(); }
};
document.getElementById("search-input").addEventListener("input", e => {
  searchQuery = e.target.value;
  document.getElementById("search-clear").style.display = searchQuery ? "block" : "none";
  renderList();
});
document.getElementById("search-clear").onclick = () => {
  searchQuery = ""; document.getElementById("search-input").value = "";
  document.getElementById("search-clear").style.display = "none";
  renderList();
};

// Add btn
document.getElementById("add-btn").onclick = () => { isAdding = true; editingItem = null; selectedId = null; render(); };

// Overdue pill
document.getElementById("overdue-pill").onclick = () => {
  filterStatus = "Overdue"; searchQuery = ""; document.getElementById("search-input").value = "";
  render();
};

// Init
if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById("panel-0").style.display = "none";
  loadItems();
}
</script>
</body>
</html>
