<html lang="en">
<head>

  <title>Work Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f5f4f1; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    #lock-screen { position: fixed; inset: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; z-index: 999; }
    #lock-box { background: #fff; border-radius: 12px; padding: 32px 28px; width: 280px; text-align: center; }

    #lock-box p { font-size: 12px; color: #999; margin-bottom: 20px; }

    #lock-btn { width: 100%; background: #c8a96e; color: #1a1a1a; border: none; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

    #header { background: #1a1a1a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    #header-title { font-size: 15px; font-weight: 700; }
    #header-sub { font-size: 11px; color: #888; margin-top: 1px; }
    #add-btn { background: #c8a96e; color: #1a1a1a; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }

    #overdue-bar { background: #c03030; color: #fff; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; align-items: center; justify-content: space-between; flex-shrink: 0; }

    #search-bar { background: #fff; border-bottom: 1px solid #e8e4dc; flex-shrink: 0; }
    #search-row { padding: 8px 12px; border-bottom: 1px solid #f0ede8; display: flex; align-items: center; gap: 8px; }
    #search-input { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; font-family: inherit; color: #1a1a1a; }
    #search-input::placeholder { color: #bbb; }
    #search-clear { border: none; background: none; color: #bbb; font-size: 14px; cursor: pointer; display: none; }
    #status-tabs { padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }

    #main { flex: 1; display: flex; overflow: hidden; }

    #list-pane { width: 100%; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #f5f4f1; transition: width 0.2s; }

    .card { background: #fff; border-radius: 10px; border: 0.5px solid #e0dbd0; cursor: pointer; }
    .card.selected { border: 1.5px solid #c8a96e; }
    .card.done { opacity: 0.45; }
    .card-body { padding: 12px 14px 8px; }
    .card-row1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 3px; }
    .card-name { font-weight: 700; font-size: 13px; color: #1a1a1a; }

    .card-meta { font-size: 11px; color: #999; }

    .card-next { font-size: 12px; color: #444; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
    .card-next-label { color: #c8a96e; font-weight: 600; }
    .card-footer { display: flex; align-items: center; gap: 8px; }
    .card-quick { padding: 0 14px 10px; }
    .quick-btn { border: 1px solid #e8e4dc; background: #faf9f6; color: #888; border-radius: 6px; padding: 4px 12px; font-size: 11px; cursor: pointer; font-family: inherit; }

    .pri-badge { padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .pri-High { background: #fde8e8; color: #9a1a1a; }

    .pri-Low { background: #f0f0f0; color: #777; }

    .status-badge { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .s-act { background: #e8f4e8; color: #2d6a2d; } .s-act .status-dot { background: #3a8a3a; }
    .s-wait { background: #fef3e2; color: #7a4f1a; } .s-wait .status-dot { background: #d4820a; }
    .s-stuck { background: #fde8e8; color: #7a1a1a; } .s-stuck .status-dot { background: #c03030; }
    .s-done { background: #f0f0f0; color: #666; } .s-done .status-dot { background: #999; }

    .follow-chip { font-size: 10px; font-weight: 600; border-radius: 10px; }
    .follow-overdue { color: #c03030; background: #fde8e8; padding: 1px 6px; }
    .follow-today { color: #c8a96e; background: #fff8ed; padding: 1px 6px; }
    .follow-soon { color: #d4820a; }
    .follow-normal { color: #999; }
    .follow-date { font-size: 10px; color: #aaa; }

    #detail-pane { flex: 1; background: #fff; border-left: 1px solid #e8e4dc; overflow-y: auto; padding: 18px 16px; display: none; }
    #detail-pane.open { display: block; }

    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
    .detail-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
    .detail-meta { font-size: 11px; color: #999; margin-bottom: 4px; }
    .detail-coworkers { font-size: 11px; color: #999; margin-bottom: 8px; }
    .detail-chips { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .follow-label { font-size: 11px; color: #777; }
    .field-block { margin-bottom: 14px; }

    .next-action-box { background: #fffbf0; border: 1px solid #e8d9a0; border-radius: 6px; padding: 8px 10px; }
    .notes-box { background: #f7f6f3; padding: 10px; border-radius: 6px; }
    .notes-box .field-content { color: #444; }
    .detail-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn { border: none; border-radius: 6px; padding: 10px; font-size: 13px; cursor: pointer; font-family: inherit; flex: 1; min-width: 80px; }
    .btn-back { background: #f0ede8; color: #444; }
    .btn-edit { background: #1a1a1a; color: #fff; font-weight: 700; }
    .btn-close { background: #e8f4e8; color: #2d6a2d; }
    .btn-delete { background: #fee; color: #c00; flex: 0; padding: 10px 14px; }

    /* Edit form */
    #edit-pane { flex: 1; background: #fff; border-left: 1px solid #e8e4dc; overflow-y: auto; padding: 18px 16px; display: none; }
    #edit-pane.open { display: block; }
    .form-title { font-size: 13px; font-weight: 700; margin-bottom: 16px; color: #1a1a1a; }
    .form-field { margin-bottom: 11px; }
    .form-label { font-size: 10px; font-weight: 600; color: #aaa; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
    .form-input { width: 100%; border: 1px solid #e0dbd0; border-radius: 6px; padding: 7px 9px; font-size: 12px; outline: none; font-family: inherit; }
    .form-row { display: flex; gap: 8px; margin-bottom: 11px; }
    .form-row .form-field { flex: 1; margin-bottom: 0; }
    .form-btns { display: flex; gap: 8px; }

    .rte-wrap { border: 1px solid #e0dbd0; border-radius: 6px; overflow: hidden; }
    .rte-toolbar { display: flex; gap: 4px; padding: 4px 6px; background: #f7f6f3; border-bottom: 1px solid #e0dbd0; flex-wrap: wrap; }
    .rte-btn { border: none; background: transparent; padding: 3px 7px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #444; font-family: inherit; line-height: 1.4; }
    .rte-btn:hover { background: #e8e4dc; }
    .rte-sep { width: 1px; background: #e0dbd0; margin: 2px; }
    .rte-body { padding: 8px 10px; font-size: 13px; min-height: 80px; outline: none; line-height: 1.6; background: #fff; color: #1a1a1a; }
    .rte-body:focus { border-color: #c8a96e; }
    .rte-body ul, .rte-body ol { padding-left: 18px; margin: 2px 0; }
    .rte-body li { margin: 1px 0; }

    /* Quick update modal */
    #quick-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
    #quick-modal.open { display: flex; }
    #quick-box { background: #fff; width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; padding: 20px 18px 32px; }
    #quick-handle { width: 36px; height: 4px; background: #e0dbd0; border-radius: 2px; margin: 0 auto 16px; }
    #quick-name { font-weight: 700; font-size: 14px; color: #1a1a1a; margin-bottom: 4px; }
    #quick-company { font-size: 11px; color: #999; margin-bottom: 16px; }
    .quick-field { margin-bottom: 12px; }
    .quick-label { font-size: 10px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    .quick-input { width: 100%; border: 1px solid #e0dbd0; border-radius: 6px; padding: 7px 9px; font-size: 13px; outline: none; font-family: inherit; }
    #quick-row { display: flex; gap: 8px; margin-bottom: 16px; }
    #quick-row .quick-field { flex: 1; margin-bottom: 0; }
    #quick-save { flex: 1; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    #quick-cancel { flex: 1; background: #f0ede8; color: #444; border: none; border-radius: 8px; padding: 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
    #quick-btns { display: flex; gap: 8px; }

    #version { position: fixed; bottom: 6px; right: 10px; font-size: 9px; color: #ccc; pointer-events: none; z-index: 999; }
    .loading-msg { padding: 40px 20px; text-align: center; color: #bbb; font-size: 13px; }
  </style>
</head>
<body>

<div id="lock-screen">
  <div id="lock-box">
    <h2>Work Tracker</h2>
    <p>Enter your password to continue</p>
    <input type="password" id="lock-pw" placeholder="Password" />
    <button id="lock-btn">Unlock</button>
  </div>
</div>

<div id="header">
  <div>
    <div id="header-title">Work Tracker</div>
    <div id="header-sub">— open · — closed</div>
  </div>
  <button id="add-btn">+ Add</button>
</div>

<div id="overdue-bar">
  <span id="overdue-text"></span>
  <span style="opacity:0.7;font-size:11px;">tap to see all →</span>
</div>

<div id="search-bar">
  <div id="search-row">
    <span style="color:#bbb;font-size:14px;">🔍</span>
    <input type="text" id="search-input" placeholder="Search person, company, or context..." />
    <button id="search-clear">✕</button>
  </div>
  <div id="status-tabs"></div>
</div>

<div id="main">
  <div id="list-pane"><div class="loading-msg">Loading...</div></div>
  <div id="detail-pane"></div>
  <div id="edit-pane"></div>
</div>

<div id="quick-modal">
  <div id="quick-box">
    <div id="quick-handle"></div>
    <div id="quick-name"></div>
    <div id="quick-company"></div>
    <div class="quick-field">
      <label class="quick-label">Quick note (added to last action)</label>
      <textarea id="quick-note" class="quick-input" rows="3" placeholder="What happened? One liner is fine."></textarea>
    </div>
    <div id="quick-row">
      <div class="quick-field">
        <label class="quick-label">Status</label>
        <select id="quick-status" class="quick-input"></select>
      </div>
      <div class="quick-field">
        <label class="quick-label">Next Follow-up</label>
        <input type="date" id="quick-date" class="quick-input" />
      </div>
    </div>
    <div id="quick-btns">
      <button id="quick-save">Save &amp; Touch Today</button>
      <button id="quick-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="version">v2.9</div>

<script>
const PASSWORD = "timmer-nyjpij-ryxRy7";
const SESSION_KEY = "wt-auth";
const SUPABASE_URL = "https://whyklzysiavybgxltjzt.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoeWtsenlzaWF2eWJneGx0anp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODIyODEsImV4cCI6MjA5Njc1ODI4MX0.x7yEeWHDhwgZreDP-SME3dWIC-B-kthc4EC0YOuphIg";
const TABLE = "work_tracker_items";
const STATUSES = ["I Need To Act","Waiting On Them","Stuck","Done"];
const PRIORITIES = ["High","Medium","Low"];
const TYPES = ["Sales Opportunity","Renewal","Escalation","Internal"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let items = [];
let selectedId = null;
let filterStatus = "All";
let searchQuery = "";
let quickItem = null;
let editingItem = null;
let isAdding = false;

// Lock screen
if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById("lock-screen").style.display = "none";
}
document.getElementById("lock-btn").onclick = () => {
  if (document.getElementById("lock-pw").value === PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "1");
    document.getElementById("lock-screen").style.display = "none";
    loadItems();
  } else {
    document.getElementById("lock-pw").style.border = "1px solid #c03030";
    document.getElementById("lock-pw").value = "";
    setTimeout(() => document.getElementById("lock-pw").style.border = "1px solid #e0dbd0", 2000);
  }
};
document.getElementById("lock-pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("lock-btn").click(); });

// Helpers
function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString("en-US", {month:"short", day:"numeric"});
}
function daysUntil(d) {
  if (!d) return null;
  const now = new Date();
  const local = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d + "T00:00:00");
  return Math.round((target - local) / 86400000);
}
function stripHtml(html) {
  if (!html) return "";
  return html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function statusClass(s) {
  if (s === "I Need To Act") return "s-act";
  if (s === "Waiting On Them") return "s-wait";
  if (s === "Stuck") return "s-stuck";
  return "s-done";
}
function followChipHtml(date) {
  if (!date) return "";
  const days = daysUntil(date);
  if (days < 0) return `<span class="follow-chip follow-overdue">↻ ${Math.abs(days)}d overdue</span>`;
  if (days === 0) return `<span class="follow-chip follow-today">↻ Today</span>`;
  if (days <= 2) return `<span class="follow-chip follow-soon">↻ ${days}d</span>`;
  return `<span class="follow-chip follow-normal">↻ ${days}d</span>`;
}

// Load
async function loadItems() {
  const { data, error } = await sb.from(TABLE).select("*");
  if (!error && data) {
    items = data;
    if (data.length > 0) {
      const sample = data[0];
    }
    render();
  }
}

// Save
async function upsert(item) { await sb.from(TABLE).upsert(item); }
async function remove(id) { await sb.from(TABLE).delete().eq("id", id); }

// Render
function getFiltered() {
  let f = items.filter(i => filterStatus === "All" || i.status === filterStatus);
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    f = f.filter(i =>
      (i.person||"").toLowerCase().includes(q) ||
      (i.company||"").toLowerCase().includes(q) ||
      stripHtml(i.context||"").toLowerCase().includes(q) ||
      (i.coWorkers||"").toLowerCase().includes(q)
    );
  }
  return f.sort((a, b) => {
    if (a.status === "Done" && b.status !== "Done") return 1;
    if (b.status === "Done" && a.status !== "Done") return -1;
    if (a.featured && !b.featured) return -1;
    if (b.featured && !a.featured) return 1;
    const fa = a.followUpDate ? new Date(a.followUpDate) : new Date("9999-12-31");
    const fb = b.followUpDate ? new Date(b.followUpDate) : new Date("9999-12-31");
    return fa - fb;
  });
}

function render() {
  renderHeader();
  renderOverdue();
  renderTabs();
  renderList();
  renderPanel();
}

function renderHeader() {
  const open = items.filter(i => i.status !== "Done").length;
  const closed = items.filter(i => i.status === "Done").length;
  document.getElementById("header-sub").textContent = `${open} open · ${closed} closed`;
}

function renderOverdue() {
  const count = items.filter(i => i.status !== "Done" && i.followUpDate && daysUntil(i.followUpDate) < 0).length;
  const bar = document.getElementById("overdue-bar");
  if (count > 0) {
    bar.style.display = "flex";
    document.getElementById("overdue-text").textContent = `⚠ ${count} item${count > 1 ? "s" : ""} past follow-up date`;
  } else {
    bar.style.display = "none";
  }
}

function renderTabs() {
  const container = document.getElementById("status-tabs");
  const tabs = ["All", ...STATUSES];
  container.innerHTML = tabs.map(s => `<button class="tab-btn${filterStatus === s ? " active" : ""}" data-status="${s}">${s}</button>`).join("");
  container.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { filterStatus = btn.dataset.status; render(); };
  });
}

function renderList() {
  const pane = document.getElementById("list-pane");
  const panelOpen = selectedId || isAdding;
  pane.className = panelOpen ? "narrow" : "";

  const filtered = getFiltered();
  if (filtered.length === 0) {
    pane.innerHTML = `<div class="loading-msg">${searchQuery ? "No results." : "Nothing here. Hit + Add to start."}</div>`;
    return;
  }

  if (filtered.length > 0) {
    const first = filtered[0];
    const ctx = first.context ? stripHtml(first.context) : "";
    const nxt = first.nextAction ? stripHtml(first.nextAction) : "";

    const testHtml = ctx ? `<div class="card-context">(${ctx})</div>` : "";
  }
  pane.innerHTML = filtered.map(item => {
    const metaParts = [item.company, item.customerType, item.type].filter(Boolean).join(" · ");
        const starHtml = item.featured ? '<span style="color:#c8a96e;font-size:14px;margin-right:3px;">★</span>' : '';
    const coworkers = item.coWorkers ? ` · 👥 ${item.coWorkers}` : "";
    const ctx = item.context ? stripHtml(item.context) : "";
    const nxt = item.nextAction ? stripHtml(item.nextAction) : "";
    const followUp = item.followUpDate ? `${followChipHtml(item.followUpDate)} <span class="follow-date">Follow up ${fmtDate(item.followUpDate)}</span>` : "";

    return `<div class="card${selectedId === item.id ? " selected" : ""}${item.status === "Done" ? " done" : ""}" data-id="${item.id}">
      <div class="card-body">
        <div class="card-row1">
          <div class="card-name"><button class="star-btn" data-id="${item.id}" style="border:none;background:none;font-size:14px;cursor:pointer;padding:0;margin-right:3px;color:${item.featured ? '#c8a96e' : '#ccc'};">★</button>${item.person}</div>
          ${item.priority ? `<span class="pri-badge pri-${item.priority}">${item.priority}</span>` : ""}
        </div>
        <div class="card-row2">
          <span class="card-meta">${metaParts}${coworkers}</span>
          <span class="status-badge ${statusClass(item.status)}"><span class="status-dot"></span>${item.status}</span>
        </div>
        ${ctx ? `<div class="card-context">(${ctx})</div>` : ""}
        ${nxt ? `<div class="card-next"><span class="card-next-label">Next: </span>${nxt}</div>` : ""}
        <div class="card-footer">${followUp}</div>
      </div>
      ${item.status !== "Done" ? `<div class="card-quick"><button class="quick-btn" data-id="${item.id}">⚡ Quick Update</button></div>` : ""}
    </div>`;
  }).join("");

  pane.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".quick-btn")) return;
      selectedId = parseInt(card.dataset.id);
      isAdding = false;
      editingItem = null;
      render();
    });
  });

  pane.querySelectorAll(".quick-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      openQuick(parseInt(btn.dataset.id));
    });
  });

  pane.querySelectorAll(".star-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.featured = !item.featured;
      await upsert(item);
      renderList();
    });
  });
}

function renderPanel() {
  const detail = document.getElementById("detail-pane");
  const editP = document.getElementById("edit-pane");

  if (isAdding || editingItem) {
    detail.className = "";
    editP.className = "open";
    renderEditForm();
    return;
  }

  editP.className = "";

  if (!selectedId) {
    detail.className = "";
    return;
  }

  const item = items.find(i => i.id === selectedId);
  if (!item) { detail.className = ""; return; }

  detail.className = "open";
  const metaParts = [item.company, item.customerType, item.type].filter(Boolean).join(" · ");
        const starHtml = item.featured ? '<span style="color:#c8a96e;font-size:14px;margin-right:3px;">★</span>' : '';

  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-name">${item.person}</div>
      <span class="status-badge ${statusClass(item.status)}"><span class="status-dot"></span>${item.status}</span>
    </div>
    <div class="detail-meta">${metaParts}</div>
    ${item.coWorkers ? `<div class="detail-coworkers">👥 ${item.coWorkers}</div>` : ""}
    <div class="detail-chips">
      ${item.priority ? `<span class="pri-badge pri-${item.priority}">${item.priority}</span>` : ""}
      ${item.followUpDate ? `<span class="follow-label">Follow up: <strong>${fmtDate(item.followUpDate)}</strong></span> ${followChipHtml(item.followUpDate)}` : ""}
    </div>
    ${item.nextAction ? `<div class="field-block"><div class="field-label">Next Action</div><div class="next-action-box field-content">${item.nextAction}</div></div>` : ""}
    ${item.context ? `<div class="field-block"><div class="field-label">Context</div><div class="field-content">${item.context}</div></div>` : ""}
    ${item.lastAction ? `<div class="field-block"><div class="field-label">Last Action</div><div class="field-content">${item.lastAction}</div></div>` : ""}
    <div class="field-block"><div class="field-label">Last Touch</div><div class="field-content">${fmtDate(item.date)}</div></div>
    ${item.notes ? `<div class="field-block"><div class="field-label">Notes</div><div class="notes-box field-content">${item.notes}</div></div>` : ""}
    <div class="detail-btns">
      <button class="btn btn-back" id="btn-back">← Back</button>
      <button class="btn btn-edit" id="btn-edit">Edit</button>
      ${item.status !== "Done" ? `<button class="btn btn-close" id="btn-close">Mark Closed</button>` : ""}
      <button class="btn btn-delete" id="btn-delete">Delete</button>
    </div>`;

  document.getElementById("btn-back").onclick = () => { selectedId = null; render(); };
  document.getElementById("btn-edit").onclick = () => { editingItem = item; render(); };
  document.getElementById("btn-delete").onclick = async () => {
    await remove(item.id);
    items = items.filter(i => i.id !== item.id);
    selectedId = null;
    render();
  };
  const closeBtn = document.getElementById("btn-close");
  if (closeBtn) {
    closeBtn.onclick = async () => {
      item.status = "Done";
      await upsert(item);
      selectedId = null;
      render();
    };
  }
}

function renderEditForm() {
  const pane = document.getElementById("edit-pane");
  const item = editingItem || {};
  const isNew = isAdding;

  pane.innerHTML = `
    <div class="form-title">${isNew ? "New Item" : "Edit Item"}</div>
    <div class="form-field"><label class="form-label">Person</label><input class="form-input" id="f-person" value="${item.person||""}" placeholder="Name" /></div>
    <div class="form-field"><label class="form-label">Company</label><input class="form-input" id="f-company" value="${item.company||""}" placeholder="Company or team" /></div>
    <div class="form-field"><label class="form-label">Context (why it's on your list)</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-context")}</div><div class="rte-body" id="f-context" contenteditable="true">${item.context||""}</div></div></div>
    <div class="form-field"><label class="form-label">Last Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-lastAction")}</div><div class="rte-body" id="f-lastAction" contenteditable="true">${item.lastAction||""}</div></div></div>
    <div class="form-field"><label class="form-label">Next Action</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-nextAction")}</div><div class="rte-body" id="f-nextAction" contenteditable="true">${item.nextAction||""}</div></div></div>
    <div class="form-field"><label class="form-label">Status</label><select class="form-input" id="f-status">${STATUSES.map(s => `<option${(item.status||"I Need To Act")===s?" selected":""}>${s}</option>`).join("")}</select></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Co-Workers Involved</label><input class="form-input" id="f-coWorkers" value="${item.coWorkers||""}" placeholder="Names" /></div>
      <div class="form-field"><label class="form-label">Customer Type</label><select class="form-input" id="f-customerType"><option value="">Not set</option><option${item.customerType==="Prospect"?" selected":""}>Prospect</option><option${item.customerType==="Current Customer"?" selected":""}>Current Customer</option></select></div>
    </div>
    <div class="form-field"><label class="form-label">Type</label><select class="form-input" id="f-type"><option value="">Not set</option>${TYPES.map(t => `<option${item.type===t?" selected":""}>${t}</option>`).join("")}</select></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Priority</label><select class="form-input" id="f-priority">${PRIORITIES.map(p => `<option${(item.priority||"Medium")===p?" selected":""}>${p}</option>`).join("")}</select></div>
      <div class="form-field"><label class="form-label">Follow-up Date</label><input type="date" class="form-input" id="f-followUpDate" value="${item.followUpDate||""}" /></div>
    </div>
    <div class="form-field"><label class="form-label">Last Touch Date</label><input type="date" class="form-input" id="f-date" value="${item.date||todayStr()}" /></div>
    <div class="form-field"><label class="form-label">Notes</label><div class="rte-wrap"><div class="rte-toolbar">${rteToolbar("f-notes")}</div><div class="rte-body" id="f-notes" contenteditable="true" style="min-height:100px">${item.notes||""}</div></div></div>
    <div class="form-btns">
      <button class="btn btn-edit" id="f-save">Save</button>
      <button class="btn btn-back" id="f-cancel">Cancel</button>
    </div>`;

  setupRteToolbars();

  document.getElementById("f-save").onclick = async () => {
    const updated = {
      id: isNew ? Date.now() : item.id,
      person: document.getElementById("f-person").value,
      company: document.getElementById("f-company").value,
      context: document.getElementById("f-context").innerHTML,
      lastAction: document.getElementById("f-lastAction").innerHTML,
      nextAction: document.getElementById("f-nextAction").innerHTML,
      status: document.getElementById("f-status").value,
      coWorkers: document.getElementById("f-coWorkers").value,
      customerType: document.getElementById("f-customerType").value,
      type: document.getElementById("f-type").value,
      priority: document.getElementById("f-priority").value,
      followUpDate: document.getElementById("f-followUpDate").value,
      date: document.getElementById("f-date").value,
      notes: document.getElementById("f-notes").innerHTML,
      category: item.category || "Commitment"
    };
    await upsert(updated);
    if (isNew) { items.push(updated); selectedId = updated.id; }
    else { items = items.map(i => i.id === updated.id ? updated : i); selectedId = updated.id; }
    isAdding = false; editingItem = null;
    render();
  };

  document.getElementById("f-cancel").onclick = () => {
    isAdding = false; editingItem = null;
    render();
  };
}

function rteToolbar(fieldId) {
  return `<button class="rte-btn" data-cmd="bold" data-field="${fieldId}"><b>B</b></button>
    <button class="rte-btn" data-cmd="italic" data-field="${fieldId}"><i>I</i></button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="insertUnorderedList" data-field="${fieldId}">• List</button>
    <button class="rte-btn" data-cmd="insertOrderedList" data-field="${fieldId}">1. List</button>
    <span class="rte-sep"></span>
    <button class="rte-btn" data-cmd="removeFormat" data-field="${fieldId}">Clear</button>`;
}

function setupRteToolbars() {
  document.querySelectorAll(".rte-btn[data-cmd]").forEach(btn => {
    btn.onmousedown = e => {
      e.preventDefault();
      const field = document.getElementById(btn.dataset.field);
      field.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    };
  });
}

// Quick update
function openQuick(id) {
  quickItem = items.find(i => i.id === id);
  if (!quickItem) return;
  document.getElementById("quick-name").textContent = quickItem.person;
  document.getElementById("quick-company").textContent = quickItem.company;
  document.getElementById("quick-note").value = "";
  document.getElementById("quick-date").value = quickItem.followUpDate || "";
  const sel = document.getElementById("quick-status");
  sel.innerHTML = STATUSES.map(s => `<option${quickItem.status===s?" selected":""}>${s}</option>`).join("");
  document.getElementById("quick-modal").className = "open";
}

document.getElementById("quick-save").onclick = async () => {
  const note = document.getElementById("quick-note").value.trim();
  const today = todayStr();
  let lastAction = quickItem.lastAction || "";
  if (note) {
    const noteHtml = `<p><em><strong>${fmtDate(today)}:</strong> ${note}</em></p>`;
    lastAction = noteHtml + lastAction;
  }
  const updated = { ...quickItem, lastAction, status: document.getElementById("quick-status").value, followUpDate: document.getElementById("quick-date").value, date: today };
  await upsert(updated);
  items = items.map(i => i.id === updated.id ? updated : i);
  document.getElementById("quick-modal").className = "";
  quickItem = null;
  render();
};

document.getElementById("quick-cancel").onclick = () => { document.getElementById("quick-modal").className = ""; quickItem = null; };
document.getElementById("quick-modal").onclick = e => { if (e.target === document.getElementById("quick-modal")) { document.getElementById("quick-modal").className = ""; quickItem = null; } };

// Search
document.getElementById("search-input").addEventListener("input", e => {
  searchQuery = e.target.value;
  document.getElementById("search-clear").style.display = searchQuery ? "block" : "none";
  renderList();
});
document.getElementById("search-clear").onclick = () => {
  searchQuery = ""; document.getElementById("search-input").value = "";
  document.getElementById("search-clear").style.display = "none";
  renderList();
};

// Add btn
document.getElementById("add-btn").onclick = () => { isAdding = true; editingItem = null; selectedId = null; render(); };

// Overdue bar
document.getElementById("overdue-bar").onclick = () => { filterStatus = "All"; searchQuery = ""; document.getElementById("search-input").value = ""; render(); };

// Init
if (sessionStorage.getItem(SESSION_KEY)) {
  document.getElementById("lock-screen").style.display = "none";
  loadItems();
}
</script>
</body>
</html>
